# Builds and publishes a release when a vX.Y.Z tag is pushed (`make release`).
# The running app finds it through GitHub's "latest release" and installs
# ja-db.exe after checking it against SHA256SUMS — see internal/selfupdate.
name: release

on:
  push:
    tags: ['v*.*.*']
  # Re-run for a tag that is already pushed: gh workflow run release.yml --ref vX.Y.Z
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The notes are the commits since the previous tag.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Check
        run: make check

      # Cross-compiled exactly as on a dev machine: every driver is pure Go.
      - name: Build
        run: make windows VERSION=${{ github.ref_name }}

      - name: Checksum
        working-directory: build/bin
        run: sha256sum ja-db.exe > SHA256SUMS

      - name: Release notes
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          git log --format='- %s' ${prev:+"$prev.."}"$GITHUB_REF_NAME" > notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          build/bin/ja-db.exe build/bin/SHA256SUMS
          --verify-tag --title "ja-db $GITHUB_REF_NAME" --notes-file notes.md
